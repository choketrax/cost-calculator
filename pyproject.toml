[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cost-auditor"
version = "0.1.0"
description = "AI Cost Auditor MVP — Reproducible AI savings decision engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.12",
    "polars>=1.0.0",
    "numpy>=2.1.0,<2.2.0",
    "scipy>=1.13.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "jinja2>=3.1.0",
    "python-dateutil>=2.9.0",
    "orjson>=3.10.0",
    "mcp>=1.2.0",
]

[project.scripts]
ai-cost-auditor-mcp = "core.mcp_server:main"

[project.optional-dependencies]
llm = [
    "openai>=1.40.0",
    "anthropic>=0.32.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "pip-audit>=2.7.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "storage*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.db"]

[tool.ruff]
line-length = 100
target-version = "py312"
