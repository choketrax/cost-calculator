# Render.com infrastructure-as-code
# Docs: https://render.com/docs/yaml-spec
#
# Setup (one-time):
#   1. Go to https://dashboard.render.com/select-repo
#   2. Connect the choketrax/Scontrol-pk GitHub repo
#   3. Render will detect this file and create the service automatically
#   4. Add your environment variables (API keys) in the Render dashboard
#
# After setup, every push to main auto-deploys AgentGateway.

services:
  - type: web
    name: agentgateway-scp
    runtime: docker
    dockerfilePath: ./agentgateway/Dockerfile
    dockerContext: ./agentgateway
    plan: free              # Free tier
    region: oregon          # Closest to Cloudflare US-West edge
    branch: main
    healthCheckPath: /healthz

    envVars:
      # ── Required: AgentGateway API key ──────────────────────────────────
      - key: AGW_API_KEY
        sync: false          # Set this secret in the Render dashboard

      # ── LLM Provider keys (add only what you use) ────────────────────
      - key: OPENAI_API_KEY
        sync: false

      - key: ANTHROPIC_API_KEY
        sync: false

      - key: GOOGLE_API_KEY
        sync: false

      # ── Optional: Portkey fallback ───────────────────────────────────
      - key: PORTKEY_API_KEY
        sync: false

      # ── Optional: Postgres MCP server ───────────────────────────────
      - key: POSTGRES_URL
        sync: false
