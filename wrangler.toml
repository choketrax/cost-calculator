name = "ai-cost-auditorv2"
account_id = "56e8d68c2c46720b0d77df12d63da7e2"
main = "worker/src/index.ts"
compatibility_date = "2026-08-14"
compatibility_flags = ["nodejs_compat"]

# Workers AI primary inference binding
[ai]
binding = "AI"

# Container — builds from local Dockerfile
[[containers]]
class_name = "AuditorContainer"
image = "./Dockerfile"
max_instances = 3

# Container bound via Durable Objects
[durable_objects]
bindings = [
  { name = "AUDITOR_CONTAINER", class_name = "AuditorContainer" },
  { name = "BUDGET_DO", class_name = "BudgetDO" }
]

# Required migration for Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuditorContainer"]

# Add v2 migration for BudgetDO
[[migrations]]
tag = "v2"
new_sqlite_classes = ["BudgetDO"]

# D1 SQLite database for audit metadata + SCP tables
# Create with: npx wrangler d1 create ai-cost-auditor-db
# Apply SCP migration: npx wrangler d1 execute ai-cost-auditor-db --file=./schema_scp.sql
[[d1_databases]]
binding = "DB"
database_name = "ai-cost-auditor-db"
database_id = "88c7fa1b-abc0-4912-8964-2f7abff74f24"

# R2 for file storage (uploaded datasets, generated reports, proof exports)
# Create with: npx wrangler r2 bucket create ai-cost-auditor
[[r2_buckets]]
binding = "AUDIT_STORAGE"
bucket_name = "ai-cost-auditor"

# ---------------------------------------------------------------------------
# Spend Control Pack bindings
# ---------------------------------------------------------------------------

# Queue for async policy event recording (fire-and-forget from authorize)
# Create with: npx wrangler queues create scp-events
[[queues.producers]]
binding = "SCP_EVENTS"
queue = "scp-events"

[[queues.consumers]]
queue = "scp-events"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 3

# Scheduled cron: alert checks + circuit breaker evaluation every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

# Non-sensitive configuration
[vars]
APP_ENV = "production"
API_KEY = "container-internal"
AI_GATEWAY_ID = "agent-gateway"
ROUTING_MODE = "cloudflare_first"
PREFER_DETERMINISTIC = "true"
EXTERNAL_LLM_DEFAULT = "false"
EXTERNAL_FALLBACK_ENABLED = "true"
EXTERNAL_FALLBACK_REQUIRES_POLICY = "true"
EXTERNAL_BUDGET_OVERRUN_ACTION = "deny"
MAX_MODEL_ATTEMPTS = "3"
LOG_ROUTING_DECISIONS = "true"
WORKERS_AI_BILLING_MODE = "standard_neurons"
WORKERS_AI_DAILY_FREE_NEURONS = "10000"
WEB_TOOLS_ENABLED = "true"

# Secrets (set with: npx wrangler secret put <NAME>)
# API_KEY             — required, main auth token
# DEEPSEEK_API_KEY    — required for live DeepSeek Search/Fetch tools
# SLACK_WEBHOOK_URL   — optional, Slack alerts for SCP budget notifications
# EMAIL_FROM          — optional, sender address for email alerts
# PORTKEY_API_KEY     — optional, Portkey gateway integration key
# PORTKEY_BASE_URL    — optional, Portkey gateway base URL (e.g. https://api.portkey.ai)
#                       If not set, proxy forwards directly to provider
# OPENROUTER_API_KEY  — optional, OpenRouter API key for Jev Router integration
#                       Set with: npx wrangler secret put OPENROUTER_API_KEY
#                       Enables model: "typesafe/jev-router" for intelligent model selection
# LOCAL_MODEL_URL     — optional, local/self-hosted model endpoint (e.g. http://localhost:8080/v1)
#                       Supports MiniMind, NanoJev, vLLM, or any OpenAI-compatible local endpoint
# BUDGET_DO           — bound DO namespace
# The Container receives env vars via the AuditorContainer class envVars definition

# ---------------------------------------------------------------------------
# Offline Vitest / Miniflare environment (prevents remote AI proxy worker crash)
# ---------------------------------------------------------------------------
[env.test]
[env.test.durable_objects]
bindings = [
  { name = "AUDITOR_CONTAINER", class_name = "AuditorContainer" },
  { name = "BUDGET_DO", class_name = "BudgetDO" }
]

[[env.test.d1_databases]]
binding = "DB"
database_name = "ai-cost-auditor-db"
database_id = "88c7fa1b-abc0-4912-8964-2f7abff74f24"

[[env.test.r2_buckets]]
binding = "AUDIT_STORAGE"
bucket_name = "ai-cost-auditor"

[[env.test.queues.producers]]
binding = "SCP_EVENTS"
queue = "scp-events"

[env.test.vars]
APP_ENV = "test"
API_KEY = "container-internal"
AI_GATEWAY_ID = "agent-gateway"
ROUTING_MODE = "cloudflare_first"
PREFER_DETERMINISTIC = "true"
EXTERNAL_LLM_DEFAULT = "false"
EXTERNAL_FALLBACK_ENABLED = "true"
EXTERNAL_FALLBACK_REQUIRES_POLICY = "true"
EXTERNAL_BUDGET_OVERRUN_ACTION = "deny"
MAX_MODEL_ATTEMPTS = "3"
LOG_ROUTING_DECISIONS = "true"
WORKERS_AI_BILLING_MODE = "standard_neurons"
WORKERS_AI_DAILY_FREE_NEURONS = "10000"
WEB_TOOLS_ENABLED = "true"
