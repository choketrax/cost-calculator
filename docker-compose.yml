services:
  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:latest
    ports:
      - "3000:3000"
      - "4000:4000"
    volumes:
      - ./agentgateway.yaml:/cfg/agentgateway.yaml:ro
    command: --file=/cfg/agentgateway.yaml
    restart: unless-stopped
    depends_on:
      - mcp

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "ai-cost-auditor-mcp"]
    environment:
      - MCP_TRANSPORT=sse
      - MCP_PORT=8001
      - MCP_HOST=0.0.0.0
      - AUDITOR_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-dev-key-change-me-before-use}
      - STORAGE_BACKEND=local
      - DATABASE_URL=sqlite:////app/data/auditor.db
      - STORAGE_PATH=/app/data/uploads
      - LLM_ENABLED=${LLM_ENABLED:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=http://agentgateway:4000/v1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - agentgateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
